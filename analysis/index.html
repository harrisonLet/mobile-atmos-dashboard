<style>
:root {
    --bg: #0b0e14;
    --panel: #121826;
    --panel-alt: #0f1422;
    --border: #1f2937;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #60a5fa;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    height: 100vh;
    overflow: hidden;
}

/* Navigation */
nav {
    background: #020617;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.nav-container {
    display: flex;
    align-items: center;
    padding: 0 12px;
}

/* Ensure consistent nav height and vertical centering */
nav { height: 56px; }
.nav-container { height: 56px; }
.nav-menu { align-items: center; }
.nav-link { display: flex; align-items: center; height: 100%; }

.nav-brand {
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
    padding: 10px 12px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
}

.nav-logo { height: 28px; }

.nav-menu { display: flex; list-style: none; margin-left: auto; }

.nav-link {
    color: var(--muted);
    text-decoration: none;
    padding: 10px 14px;
    font-size: 0.9rem;
}


.nav-link:hover { color: var(--text); background: var(--panel-alt); }

/* Data selectors (shared) */
.data-selectors { display: flex; align-items: center; gap: 15px; padding: 10px 15px; }
.selector-group { display: flex; align-items: center; gap: 8px; }
.selector-group label { color: var(--muted); font-size: 0.85rem; font-weight: 500; margin-right: 6px; }
.selector-group select {
    padding: 4px 12px;
    font-size: 0.85rem;
    line-height: normal;
    height: 32px;
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
}

/* Layout used on analysis page */
.main-grid { display: flex; height: 47.5vh; gap: 5px; padding: 5px; }
.bottom-grid { display: flex; height: 47.5vh; gap: 5px; padding: 5px; }

.bottom-grid .panel > .chart-container {
    flex: 1;
    min-height: 0;
    height: 100%;
    width: 100%;
}

.panel {
    flex: 1; display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--border); padding: 8px; overflow: hidden;
}
.main-grid > .panel:first-child { /* selection map slightly smaller */
    flex: 0.9;
}
.main-grid > .panel:nth-child(2) { /* time series slightly larger */
    flex: 1.1;
}
/* Make the ratio plot slightly larger than the wind rose */
.bottom-grid > .panel:first-child { flex: 1.4; }
.bottom-grid > .panel:nth-child(2) { flex: 0.6; }
.panel h2 { margin: 0 0 6px 0; font-size: 0.95rem; color: var(--text); }
.panel iframe, .panel > .chart-container { flex: 1; min-height: 0; width: 100%; }

/* Panel-level column selectors */
.panel-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 0 5px 0;
    flex: 0 0 auto;
}
.panel-controls .selector-group label {
    font-size: 0.78rem;
    margin-right: 3px;
}
.panel-controls .selector-group select {
    height: 26px;
    padding: 2px 8px;
    font-size: 0.78rem;
    max-width: 160px;
}

.plotly-dark { background-color: var(--panel); color: var(--text); }

.layer-toggle { background: var(--panel-alt); color: var(--text); padding: 4px 8px; font-size: 0.75rem; cursor: pointer; border-radius: 4px; }
.layer-toggle:hover { background: var(--accent); color: #121826; }

/* Plume detection controls */
.panel-controls input[type="number"] {
    width: 56px;
    height: 26px;
    padding: 2px 6px;
    font-size: 0.78rem;
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
}
.plume-btn {
    height: 26px;
    padding: 0 10px;
    font-size: 0.78rem;
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
}
.plume-btn:hover { background: var(--accent); color: #121826; }
.plume-count-label {
    font-size: 0.78rem;
    color: #fb7185;
    margin-left: 4px;
    font-weight: 500;
}


@media (max-width: 800px) {
    .main-grid, .bottom-grid { flex-direction: column; height: 50vh; }
}
</style>
</head>

<script>

// Met columns to exclude from species detection
const MET_COLS = new Set([
    'TIMESTAMP', 'LAT_Sprinter', 'LON_Sprinter',
    'TEMP_C_Sprinter', 'RH_Sprinter', 'WIND_DIR_Sprinter',
    'WIND_SPEED_Sprinter', 'PRESSURE_Sprinter'
]);

// Campaign date configurations
const datesByCampaign= {
    'slv': [
	{ value: '20260203', label: 'February 3, 2026'},
	{ value: '20260204', label: 'February 4, 2026'},
	{ value: '20260205', label: 'February 5, 2026'},
	{ value: '20260206', label: 'February 6, 2026'},
    { value: '20260208', label: 'February 8, 2026' },
    { value: '20260209', label: 'February 9, 2026' },
    { value: '20260210', label: 'February 10, 2026' },
    { value: '20260211', label: 'February 11, 2026' },
    { value: '20260212', label: 'February 12, 2026' },



    ],
    'arc': [
        { value: '20240716', label: '20240716' },
        { value: '20240717', label: '20240717' },
        { value: '20240718', label: '20240718' },
        { value: '20240719', label: '20240719' },
        { value: '20240721', label: '20240721' },
        { value: '20240722', label: '20240722' },
        { value: '20240723', label: '20240723' },
        { value: '20240725', label: '20240725' },
        { value: '20240726', label: '20240726' },
        { value: '20240727', label: '20240727' },
        { value: '20240728', label: '20240728' },
        { value: '20240729', label: '20240729' },
        { value: '20240730', label: '20240730' },
        { value: '20240731', label: '20240731' },
        { value: '20240802', label: '20240802' },
        { value: '20240803', label: '20240803' },
        { value: '20240804', label: '20240804' },
    ],
    'slc-sos': [
    ]
};

let currentData = [];
let speciesColumns = [];
let currentPlumes = null;
let selectionMap = null;
let startMarker = null;
let endMarker = null;
let selectionPolyline = null;
let selectionPolylineOutline = null;


const campaignSelect = document.getElementById('campaignSelect');
const dateSelect = document.getElementById('dateSelect');
const tsCol1Select = document.getElementById('tsCol1');
const tsCol2Select = document.getElementById('tsCol2');
const ratioXSelect = document.getElementById('ratioX');
const ratioYSelect = document.getElementById('ratioY');


// Get URL parameters
const urlParams = new URLSearchParams(window.location.search);

campaignSelect.value = urlParams.get('campaign') || 'slv';

populateDates();

// Event listeners
campaignSelect.addEventListener('change', e => {
    console.log('campaignSelect changed:', e.target.value);
    populateDates();
});

dateSelect.addEventListener('change', e => {
    console.log('dateSelect changed:', e.target.value);
    loadDate();
});

tsCol1Select.addEventListener('change', plotTimeSeries);
tsCol2Select.addEventListener('change', plotTimeSeries);
ratioXSelect.addEventListener('change', () => plotCH4Ethane(currentData));
ratioYSelect.addEventListener('change', () => plotCH4Ethane(currentData));

function getPaths() {
    return {
        csv: `../data/${campaignSelect.value}/${dateSelect.value}/${dateSelect.value}.csv`,
    };
}

function loadDate() {
    const paths = getPaths();

    console.log("Loading CSV from:", paths.csv);

    Papa.parse(paths.csv, {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: r => {
            console.log("CSV loaded successfully");
            parseData(r.data);
        },
        error: err => {
            console.error("Error loading CSV:", err);
            alert("Error loading CSV file: " + paths.csv + "\n" + err);
        }
    });
}

function parseData(rows) {
    console.log("Raw rows received:", rows.length);
    console.log("First row:", rows[0]);

    if (!rows.length) return;

    // Detect species columns from the first row's keys
    const allCols = Object.keys(rows[0]);
    speciesColumns = allCols.filter(c => !MET_COLS.has(c));
    console.log("Species columns detected:", speciesColumns);

    currentData = rows.map(r => ({
        time: new Date(r["TIMESTAMP"]),
        windDir: r["WIND_DIR_Sprinter"],
        windSpeed: r["WIND_SPEED_Sprinter"],
        lat: r["LAT_Sprinter"],
        lon: r["LON_Sprinter"],
        values: r
    })).filter(d => d.time instanceof Date && !isNaN(d.time));

    console.log("Filtered data length:", currentData.length);
    console.log("First filtered point:", currentData[0]);

    populateColumnSelects();

    // Reset plume state on new date load
    currentPlumes = null;
    document.getElementById('plumeCountLabel').textContent = '';

    plotTimeSeries();
    plotCH4Ethane(currentData);
    plotWindRose(currentData);
    plotSelectionMap(currentData);
}

function populateColumnSelects() {
    [tsCol1Select, tsCol2Select, ratioXSelect, ratioYSelect].forEach((sel, i) => {
        const addNone = i === 1; // tsCol2 can be "None"
        sel.innerHTML = addNone ? '<option value="">None</option>' : '';
        speciesColumns.forEach(col => {
            const opt = document.createElement('option');
            opt.value = col;
            opt.textContent = col;
            sel.appendChild(opt);
        });
    });

    // Smart defaults: prefer CH4 for primary, C2H6 for secondary
    const ch4Col = speciesColumns.find(c => /^CH4_/i.test(c)) || speciesColumns[0] || '';
    const c2h6Col = speciesColumns.find(c => /^C2H6_/i.test(c)) || '';

    tsCol1Select.value = ch4Col;
    tsCol2Select.value = c2h6Col;
    ratioXSelect.value = ch4Col;
    ratioYSelect.value = c2h6Col || speciesColumns[1] || '';
}

function plotTimeSeries() {
    const col1 = tsCol1Select.value;
    const col2 = tsCol2Select.value;
    const traces = [];

    if (col1) {
        traces.push({
            x: currentData.map(d => d.time),
            y: currentData.map(d => {
                const v = d.values[col1];
                return (v !== null && v !== undefined && isFinite(v)) ? v : null;
            }),
            type: "scattergl",
            mode: "lines+markers",
            marker: { size: 2, opacity: 0 },
            line: { width: 1.5, color: '#ff3dff' },
            connectgaps: true,
            name: col1,
            yaxis: 'y'
        });
    }

    if (col2) {
        traces.push({
            x: currentData.map(d => d.time),
            y: currentData.map(d => {
                const v = d.values[col2];
                return (v !== null && v !== undefined && isFinite(v)) ? v : null;
            }),
            type: "scattergl",
            mode: "lines+markers",
            marker: { size: 2, opacity: 0 },
            line: { width: 1.5, color: '#CFFF04' },
            connectgaps: true,
            name: col2,
            yaxis: 'y2'
        });
    }

    // Add plume baseline trace if detection has been run
    if (currentPlumes) {
        traces.push({
            x: currentPlumes.pts.map(p => currentData[p.i].time),
            y: currentPlumes.pts.map(p => p.bg),
            type: 'scattergl',
            mode: 'lines',
            line: { width: 1.2, color: '#60a5fa', dash: 'dash' },
            name: 'Background',
            yaxis: 'y',
            hoverinfo: 'skip',
            connectgaps: true
        });
    }

    const layout = {
        autosize: true,
        dragmode: "select",
        paper_bgcolor: "#0b0e14",
        plot_bgcolor: "#020617",
        xaxis: {
            title: {
                text: "Time (UTC)",
                font: { color: "#9ca3af" }
            },
            tickfont: { color: "#9ca3af" },
            gridcolor: "#1f2937",
            zerolinecolor: "#1f2937"
        },
        yaxis: {
            title: {
                text: col1 || '',
                font: { color: "#ff3dff" }
            },
            tickfont: { color: "#ff3dff" },
            gridcolor: "#1f2937",
            zerolinecolor: "#1f2937"
        },
        yaxis2: col2 ? {
            title: {
                text: col2,
                font: { color: "#CFFF04" }
            },
            tickfont: { color: "#CFFF04" },
            overlaying: "y",
            side: "right",
            gridcolor: "#1f2937",
            zerolinecolor: "#1f2937"
        } : { overlaying: 'y', side: 'right', visible: false },
        legend: {
            x: 0.01,
            y: 0.99,
            bgcolor: "rgba(2,6,23,0.85)",
            bordercolor: "#1f2937",
            borderwidth: 1,
            font: { color: "#e5e7eb", size: 12 }
        },
        margin: { l: 60, r: 60, t: 20, b: 45 },
        selectdirection: "h",
        shapes: currentPlumes ? currentPlumes.plumes.map(plume => ({
            type: 'rect',
            xref: 'x',
            yref: 'paper',
            x0: plume.start,
            x1: plume.end,
            y0: 0,
            y1: 1,
            fillcolor: 'rgba(251, 113, 133, 0.15)',
            line: { width: 0 }
        })) : []
    };

    Plotly.newPlot("timeSeries", traces, layout);

    document.getElementById("timeSeries")
        .on("plotly_selected", e => {
            if (!e) return;

            // Use e.range.x directly — it gives the exact x-axis bounds of the
            // selection box without depending on pointIndex, which can be unreliable
            // with connectgaps:true and null y-values in scattergl traces.
            let tMin, tMax;
            if (e.range && e.range.x && e.range.x.length === 2) {
                tMin = new Date(e.range.x[0]);
                tMax = new Date(e.range.x[1]);
            } else if (e.points && e.points.length) {
                // Fallback for lasso or other selection modes
                const mainTraceCount = (col1 ? 1 : 0) + (col2 ? 1 : 0);
                const mainPts = e.points.filter(p => p.curveNumber < mainTraceCount);
                if (!mainPts.length) return;
                const times = mainPts.map(p => currentData[p.pointIndex]?.time).filter(Boolean);
                if (!times.length) return;
                tMin = new Date(Math.min(...times));
                tMax = new Date(Math.max(...times));
            } else {
                return;
            }

            if (isNaN(tMin) || isNaN(tMax)) return;

            const inRange = currentData.filter(d => d.time >= tMin && d.time <= tMax);
            if (!inRange.length) return;

            plotCH4Ethane(inRange);
            plotWindRose(inRange);
            plotSelectionMap(inRange);
        });
}


function plotCH4Ethane(data) {
    const xCol = ratioXSelect.value;
    const yCol = ratioYSelect.value;

    if (!xCol || !yCol) {
        Plotly.newPlot("ch4Ethane", [], {
            paper_bgcolor: '#121826',
            plot_bgcolor: '#121826',
            font: { color: '#e5e7eb' }
        }, { responsive: true });
        return;
    }

    const pairs = data
        .map(d => ({ x: d.values[xCol], y: d.values[yCol] }))
        .filter(p => p.x !== null && p.y !== null && isFinite(p.x) && isFinite(p.y));

    const x = pairs.map(p => p.x);
    const y = pairs.map(p => p.y);

    const trace = {
        x, y,
        mode: "markers",
        type: "scattergl",
        marker: { color: "#CFFF04", size: 6, opacity: 0.7 },
        name: "Data"
    };

    let n = x.length;
    let annotations = [];
    const plotTraces = [trace];

    if (n > 1) {
        const sumX = x.reduce((a,b) => a+b, 0);
        const sumY = y.reduce((a,b) => a+b, 0);
        const sumXY = x.reduce((acc, xi, i) => acc + xi*y[i], 0);
        const sumX2 = x.reduce((acc, xi) => acc + xi*xi, 0);

        const slope = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);
        const intercept = (sumY - slope*sumX) / n;

        const meanY = sumY / n;
        const ssTotal = y.reduce((acc, yi) => acc + Math.pow(yi - meanY, 2), 0);
        const yFit = x.map(xi => slope*xi + intercept);
        const ssResidual = y.reduce((acc, yi, i) => acc + Math.pow(yi - yFit[i], 2), 0);
        const r2 = ssTotal > 0 ? 1 - (ssResidual / ssTotal) : 0;

        plotTraces.push({
            x, y: yFit,
            mode: "lines",
            line: { color: "#ff3dff", width: 2 },
            name: "Regression",
            hoverinfo: "none"
        });

        annotations = [{
            x: 0.5,
            y: 0.95,
            xref: 'paper',
            yref: 'paper',
            text: `Slope: ${slope.toFixed(4)} ${yCol}/${xCol}<br>R²: ${r2.toFixed(3)}`,
            showarrow: false,
            font: {
                color: '#e5e7eb',
                size: 14,
                family: 'monospace'
            },
            bgcolor: 'rgba(18, 24, 38, 0.8)',
            bordercolor: '#FFFFFF',
            borderwidth: 1,
            borderpad: 8,
            align: 'left'
        }];
    }

    Plotly.newPlot("ch4Ethane", plotTraces, {
        margin: { l: 55, r: 20, t: 20, b: 45 },
        autosize: true,
        paper_bgcolor: '#121826',
        plot_bgcolor: '#121826',
        font: { color: '#e5e7eb' },
        xaxis: {
            title: xCol,
            gridcolor: '#1f2937'
        },
        yaxis: {
            title: yCol,
            gridcolor: '#1f2937'
        },
        showlegend: false,
        annotations: annotations
    }, { responsive: true });
}

function detectPlumes(col, windowSize, sigma, minDuration) {
    // Build array of valid (non-null) points for this column, keeping index into currentData
    const pts = currentData
        .map((d, i) => ({ i, time: d.time, v: d.values[col] }))
        .filter(p => p.v !== null && p.v !== undefined && isFinite(p.v));

    // Trailing rolling median + std for background estimation
    for (let j = 0; j < pts.length; j++) {
        const win = pts.slice(Math.max(0, j - windowSize), j).map(p => p.v);
        if (win.length < Math.min(10, windowSize / 2)) {
            pts[j].bg = pts[j].v;
            pts[j].std = 0;
            continue;
        }
        const sorted = win.slice().sort((a, b) => a - b);
        pts[j].bg = sorted[Math.floor(sorted.length / 2)];
        const mean = win.reduce((a, b) => a + b, 0) / win.length;
        pts[j].std = Math.sqrt(win.reduce((a, v) => a + (v - mean) ** 2, 0) / win.length);
    }

    // Flag points exceeding threshold
    pts.forEach(p => {
        p.enhancement = p.v - p.bg;
        p.flagged = p.std > 0 && p.enhancement > sigma * p.std;
    });

    // Group consecutive flagged points into plumes, apply min duration filter
    const plumes = [];
    let plumeStart = null;

    for (let j = 0; j <= pts.length; j++) {
        const flagged = j < pts.length && pts[j].flagged;
        if (flagged && plumeStart === null) {
            plumeStart = j;
        } else if (!flagged && plumeStart !== null) {
            if (j - plumeStart >= minDuration) {
                plumes.push({
                    start: pts[plumeStart].time,
                    end: pts[j - 1].time,
                    points: pts.slice(plumeStart, j)
                });
            }
            plumeStart = null;
        }
    }

    return { pts, plumes };
}

function runPlumeDetection() {
    const col = tsCol1Select.value;
    if (!col || !currentData.length) return;

    const windowSize = parseInt(document.getElementById('plumeWindow').value) || 60;
    const sigma     = parseFloat(document.getElementById('plumeSigma').value)  || 2.0;
    const minDur    = parseInt(document.getElementById('plumeMinDur').value)   || 5;

    currentPlumes = detectPlumes(col, windowSize, sigma, minDur);

    const n = currentPlumes.plumes.length;
    document.getElementById('plumeCountLabel').textContent =
        `${n} plume${n !== 1 ? 's' : ''} detected`;

    plotTimeSeries();
}

function clearPlumes() {
    currentPlumes = null;
    document.getElementById('plumeCountLabel').textContent = '';
    plotTimeSeries();
}

function plotWindRose(data) {
    const dirBins = 16;
    const dirBinSize = 360 / dirBins;

    // Speed bins (m/s)
    const speedBins = [
        { label: "0–2", min: 0, max: 2, color: "#60a5fa" },
        { label: "2–4", min: 2, max: 4, color: "#34d399" },
        { label: "4–6", min: 4, max: 6, color: "#fbbf24" },
        { label: "6–8", min: 6, max: 8, color: "#fb7185" },
        { label: ">8",  min: 8, max: Infinity, color: "#ef4444" }
    ];

    // counts[speedBin][dirBin]
    const counts = speedBins.map(() => Array(dirBins).fill(0));

    data.forEach(d => {
        if (!isFinite(d.windDir) || !isFinite(d.windSpeed)) return;

        const dirIdx = Math.floor(d.windDir / dirBinSize) % dirBins;

        const speedIdx = speedBins.findIndex(
            b => d.windSpeed >= b.min && d.windSpeed < b.max
        );

        if (speedIdx !== -1) {
            counts[speedIdx][dirIdx] += 1;
        }
    });

    const theta = [...Array(dirBins).keys()].map(i => i * dirBinSize);

    const traces = speedBins.map((bin, i) => ({
        type: "barpolar",
        r: counts[i],
        theta: theta,
        width: dirBinSize,
        name: `${bin.label} m/s`,
        marker: {
            color: bin.color,
            opacity: 0.85
        }
    }));

    Plotly.newPlot("windRose", traces, {

        margin: { l: 20, r: 20, t: 20, b: 20 },

        height: document.getElementById('windRose').closest('.panel').clientHeight - 16,
        autosize: true,


        paper_bgcolor: "#121826",

        plot_bgcolor: "#121826",
        font: { color: "#e5e7eb" },
        polar: {
            angularaxis: {
                direction: "clockwise",
                rotation: 90
            },
            radialaxis: {
                title: "Frequency",
                gridcolor: "#1f2937"
            }
        },
        legend: {
            orientation: "h",
            x: 0.5,
            y: -0.15,
            xanchor: "center"
        }
    }, { responsive: true });
}


function plotSelectionMap(data) {
    if (!data.length) return;

    // Filter and sort by time up front — all subsequent logic uses this ordered array
    const validGPSData = data
        .filter(d => isFinite(d.lat) && isFinite(d.lon) && Math.abs(d.lat) > 1 && Math.abs(d.lon) > 1)
        .sort((a, b) => a.time - b.time);

    if (!validGPSData.length) {
        console.log("No valid GPS coordinates in selection");
        return;
    }

    // First and last in time order
    const startPoint = validGPSData[0];
    const endPoint   = validGPSData[validGPSData.length - 1];

    if (!selectionMap) {
        selectionMap = L.map('selectionMap').setView(
            [startPoint.lat, startPoint.lon],
            13
        );

        const osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }
        );

        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                maxZoom: 19,
                attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
            }
        );

        satellite.addTo(selectionMap);

        const baseLayers = {
            "Satellite": satellite,
            "OpenStreetMap": osm
        };

        let isSatellite = true;

        const toggleControl = L.control({ position: 'topright' });

        toggleControl.onAdd = function () {
            const div = L.DomUtil.create('div', 'layer-toggle');
            div.innerHTML = 'open';
            L.DomEvent.disableClickPropagation(div);

            div.onclick = () => {
                if (isSatellite) {
                    selectionMap.removeLayer(satellite);
                    osm.addTo(selectionMap);
                    div.innerHTML = 'sat';
                } else {
                    selectionMap.removeLayer(osm);
                    satellite.addTo(selectionMap);
                    div.innerHTML = 'open';
                }
                isSatellite = !isSatellite;
            };

            return div;
        };

        toggleControl.addTo(selectionMap);
    }

    // Build all new layers before touching existing ones — if anything
    // throws during construction the old state remains intact
    const col1 = tsCol1Select.value;
    const startVal1 = col1 && isFinite(startPoint.values[col1]) ? `<br>${col1}: ${startPoint.values[col1].toFixed(4)}` : '';
    const endVal1   = col1 && isFinite(endPoint.values[col1])   ? `<br>${col1}: ${endPoint.values[col1].toFixed(4)}`   : '';

    const startIcon = L.divIcon({
        className: 'selection-marker',
        html: `<div style="width:15px;height:15px;background:#ffffff;border:2.5px solid green;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,0.25);"></div>`,
        iconSize: [10, 10], iconAnchor: [5, 5]
    });
    const endIcon = L.divIcon({
        className: 'selection-marker',
        html: `<div style="width:15px;height:15px;background:#ffffff;border:2.5px solid red;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,0.25);"></div>`,
        iconSize: [10, 10], iconAnchor: [5, 5]
    });

    const newStartMarker = L.marker([startPoint.lat, startPoint.lon], { icon: startIcon })
        .bindPopup(`<b>Start</b><br>Time: ${startPoint.time.toISOString()}${startVal1}`);
    const newEndMarker = L.marker([endPoint.lat, endPoint.lon], { icon: endIcon })
        .bindPopup(`<b>End</b><br>Time: ${endPoint.time.toISOString()}${endVal1}`);

    const pathCoords = validGPSData.map(d => [d.lat, d.lon]);
    const newOutline = L.polyline(pathCoords, { color: '#000000', weight: 6, opacity: 0.45 });
    const newLine    = L.polyline(pathCoords, { color: '#00d4ff', weight: 3, opacity: 0.9 });

    // All layers built successfully — now swap out the old ones
    if (startMarker)             { selectionMap.removeLayer(startMarker);             startMarker             = null; }
    if (endMarker)               { selectionMap.removeLayer(endMarker);               endMarker               = null; }
    if (selectionPolylineOutline){ selectionMap.removeLayer(selectionPolylineOutline); selectionPolylineOutline = null; }
    if (selectionPolyline)       { selectionMap.removeLayer(selectionPolyline);        selectionPolyline        = null; }

    startMarker             = newStartMarker.addTo(selectionMap);
    endMarker               = newEndMarker.addTo(selectionMap);
    selectionPolylineOutline = newOutline.addTo(selectionMap);
    selectionPolyline        = newLine.addTo(selectionMap);

    try {
        const polyBounds = selectionPolyline.getBounds();
        if (polyBounds.isValid()) {
            selectionMap.fitBounds(polyBounds, { padding: [50, 50] });
        }
    } catch (err) {
        selectionMap.fitBounds(
            L.latLngBounds([[startPoint.lat, startPoint.lon], [endPoint.lat, endPoint.lon]]),
            { padding: [50, 50] }
        );
    }
}

function loadFromSelectors() {
    const campaign = campaignSelect.value;
    const date = dateSelect.value;

    if (!campaign || !date) return;

    loadDate();
}

function populateDates() {
    const campaign = campaignSelect.value || 'slv';
    const dates = datesByCampaign[campaign] || [];

    dateSelect.innerHTML = '<option value="">Select a date...</option>';
    dates.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.value;
        opt.textContent = d.label;
        dateSelect.appendChild(opt);
    });

    // If dates were added, auto-select the first and load it so the UI updates
    if (dates.length > 0) {
        dateSelect.value = dates[0].value;
        console.log('populateDates: auto-selected', dateSelect.value, 'for', campaignSelect.value);
        loadDate();
    }
    else {
        console.warn('populateDates: no dates available for', campaign);
    }
}
